<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark e Light mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black min-h-screen">
    <main class="min-h-screen flex justify-center py-5 px-4">

        <div class="w-full max-w-[1000px] h-[1300px] bg-gray-100 rounded-xl">
            <header class="h-[70px] flex items-center justify-between bg-white rounded-t-xl">

                <div class="p-4 flex items-center gap-4">
                    <img src="assets/Background.png" alt="">
                    <span class="text-xs font-bold dark:text-white"> Minimal Store </span>
                </div>
                
                <!-- BOTÃO DARK/LIGHT -->
                <button onclick="toggleMode()" type="button"
                        class="text-left h-[29px] w-[155px] items-center justify-start rounded-full 
                           bg-gray-100 border border-gray-200 dark:border
                           text-[10px] font-medium pl-4
                           text-gray-600 dark:text-gray-400
                           hover:text-black dark:hover:text-white
                           transition">

                    Dark mode

                </button>

            </header>

            <!-- conteudo -->
            <div class="p-5">

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">

                    <!-- lado esquerdo -->
                     <div class="lg:col-span-2 space-y-4">
  
                            <h2 class="text-xs font-semibold text-gray-800 dark:text-white">
                                <span class="inline-flex items-center justify-center w-5 h-8 rounded-full bg-gray-200 text-[12px] font-semibold">
                                     1
                                </span>

                                <span class="ml-1 text-[14px]">
                                    Dados Pessoais
                                </span>
                            </h2>
                        
                            <!-- Dados Pessoais -->
                        <section class="bg-white border border-gray-100 rounded-lg p-4">
                            <!-- email -->
                            <div class="mb-3">
                                <label class="block text-[12px] text-gray-600 dark:text-gray-400 mb-1 font-medium">
                                    E-mail para confirmação
                                </label>

                                <input type="email" placeholder="seuemail@exemplo.com" class="w-full h-9 border border-gray-400 rounded-md text-[10px] text-gray-800 dark:text-gray-200 outline-none focus:border-gray-500 pl-4">
                            
                            </div>

                            <!-- nome e cpf-->
                             <div class="flex gap-14 ">
                                <div class="mb-3">
                                <label class="block text-[12px] text-gray-600 dark:text-gray-400 mb-1 font-medium pt-3">
                                    Nome Completo
                                </label>

                                <input type="name" placeholder="Jonatan" class="w-[250px] h-9 border border-gray-400 rounded-md text-[10px] text-gray-800 dark:text-gray-200 outline-none focus:border-gray-500 pl-4">
                            
                            </div>

                            <!-- cpf -->
                            <div class="mb-3">
                                <label class="block text-[12px] text-gray-600 dark:text-gray-400 mb-1 font-medium pt-3">
                                    CPF
                                </label>

                                <input type="number" placeholder="492.012.192.09" class="w-[290px] h-9 border border-gray-400 rounded-md text-[10px] text-gray-800 dark:text-gray-200 outline-none focus:border-gray-500 pl-4">
                            
                                
                            </div>

                            
                            </div>
                        
                            <!-- Telefone/WhatsApp -->
                            <div class="mb-3 pt-5">
                                <label class="block text-[12px] text-gray-600 dark:text-gray-400 mb-1 font-medium">
                                    Telefone/WhatsApp
                                </label>

                                <input type="number" placeholder="(11) 98982-9098" class="w-full h-9 border border-gray-400 rounded-md text-[10px] text-gray-800 dark:text-gray-200 outline-none focus:border-gray-500 pl-4">
                            
                            </div>
                            
                        </section>
                        
                        <!-- Endereço de entrega -->
                         <h2 class="text-xs font-semibold text-gray-800 dark:text-white">
                                <span class="inline-flex items-center justify-center w-5 h-8 rounded-full bg-gray-200 text-[12px] font-semibold">
                                     2
                                </span>

                                <span class="ml-1 text-[14px]">
                                    Endereço de Entrega
                                </span>
                            </h2>
                        <section class="bg-white border border-gray-100 rounded-lg p-4">

                            <!-- cep -->
                             <div class="flex ">
                                <div class="mb-3">
                                <label class="block text-[12px] text-gray-600 dark:text-gray-400 mb-1 font-medium pt-3">
                                    CEP
                                </label>

                                <input type="number" placeholder="08090-100" class="w-[200px] h-9 border border-gray-400 rounded-md text-[10px] text-gray-800 dark:text-gray-200 outline-none focus:border-gray-500 pl-4">
                            
                            </div>

                            <!-- cidade -->
                            <div class="mb-3">
                                <label class="block text-[12px] text-gray-600 dark:text-gray-400 mb-1 font-medium pt-3">
                                    Cidade / UF
                                </label>

                                <input type="text" placeholder="São Paulo - SP" class="w-[400px] h-9 border border-gray-400 rounded-md text-[10px] text-gray-800 dark:text-gray-200 outline-none focus:border-gray-500 pl-4">
                            
                                
                            </div>

                            
                            </div>

                            <!-- avenida -->
                            <div class="flex ">
                                <div class="mb-3">
                                <label class="block text-[12px] text-gray-600 dark:text-gray-400 mb-1 font-medium pt-3">
                                    Lougradouro / Avenida
                                </label>

                                <input type="text" placeholder="Av. Paulista" class="w-[400px] h-9 border border-gray-400 rounded-md text-[10px] text-gray-800 dark:text-gray-200 outline-none focus:border-gray-500 pl-4">
                            
                            </div>

                            <!-- numero -->
                            <div class="mb-3">
                                <label class="block text-[12px] text-gray-600 dark:text-gray-400 mb-1 font-medium pt-3">
                                    Número
                                </label>

                                <input type="number" placeholder="1578" class="w-[200px] h-9 border border-gray-400 rounded-md text-[10px] text-gray-800 dark:text-gray-200 outline-none focus:border-gray-500 pl-4">
                            
                                
                            </div>

                            
                            </div>
                        
                            
                            
                        </section>

                        <!-- Forma de pagamento -->
                         <h2 class="text-xs font-semibold text-gray-800 dark:text-white">
                                <span class="inline-flex items-center justify-center w-5 h-8 rounded-full bg-gray-200 text-[12px] font-semibold">
                                     3
                                </span>

                                <span class="ml-1 text-[14px]">
                                    Forma de Pagamento
                                </span>
                            </h2>
                        <section class="bg-white border border-gray-100 rounded-lg p-4">

                            <!-- Formas de pagamento -->
                            <div class="grid grid-cols-3 gap-2 mb-5">

                                <!-- CARTÃO -->
                                <button type="button"
                                    class="relative h-14 rounded-md border border-gray-800 bg-white
                                        flex flex-col items-center justify-center gap-1
                                        text-gray-800">

                                    <!-- Ícone -->
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                                        <path d="M3 10h18"></path>
                                    </svg>

                                    <span class="text-[11px] font-medium">Cartão</span>
                                </button>


                                <!-- PIX -->
                                <button type="button"
                                    class="relative h-14 rounded-md border border-gray-200 bg-gray-50
                                        flex flex-col items-center justify-center gap-1
                                        text-gray-500">

                                    <!-- Desconto -->
                                    <span class="absolute -top-2 right-2 bg-green-600 text-white
                                                text-[9px] font-bold px-2 py-0.5 rounded-full">
                                        -5% OFF
                                    </span>

                                    <!-- Ícone -->
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path d="M12 3l9 9-9 9-9-9 9-9z"></path>
                                        <path d="M9 12h6"></path>
                                    </svg>

                                    <span class="text-[11px] font-medium">PIX</span>
                                </button>


                                <!-- BOLETO -->
                                <button type="button"
                                    class="relative h-14 rounded-md border border-gray-200 bg-gray-50
                                        flex flex-col items-center justify-center gap-1
                                        text-gray-500">

                                    <!-- Ícone -->
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <rect x="6" y="4" width="12" height="16" rx="1"></rect>
                                        <path d="M9 8h6"></path>
                                        <path d="M9 12h6"></path>
                                        <path d="M9 16h3"></path>
                                    </svg>

                                    <span class="text-[11px] font-medium">Boleto</span>
                                </button>

                            </div>

                            <!-- numero do cartao -->
                            <div class="mb-3">
                                <label class="block text-[12px] text-gray-600 dark:text-gray-400 mb-1 font-medium">
                                    Número do Cartão
                                </label>

                                <input type="number" placeholder="498 *** *** 987" class="w-full h-9 border border-gray-400 rounded-md text-[10px] text-gray-800 dark:text-gray-200 outline-none focus:border-gray-500 pl-4">
                            
                            </div>


                            <!-- nome no cartao -->
                            <div class="mb-3">
                                <label class="block text-[12px] text-gray-600 dark:text-gray-400 mb-1 font-medium">
                                    Nome no Cartão
                                </label>

                                <input type="text" placeholder="LUCAS SILVA" class="w-full h-9 border border-gray-400 rounded-md text-[10px] text-gray-800 dark:text-gray-200 outline-none focus:border-gray-500 pl-4">
                            
                            </div>

                            <!-- validade -->
                             <div class="flex gap-5">
                                <div class="mb-3">
                                <label class="block text-[12px] text-gray-600 dark:text-gray-400 mb-1 font-medium pt-3">
                                    Validade
                                </label>

                                <input type="number" placeholder="08/29" class="w-[290px] h-9 border border-gray-400 rounded-md text-[10px] text-gray-800 dark:text-gray-200 outline-none focus:border-gray-500 pl-4">
                            
                            </div>

                            <!-- CVV -->
                            <div class="mb-3">
                                <label class="block text-[12px] text-gray-600 dark:text-gray-400 mb-1 font-medium pt-3">
                                    CVV
                                </label>

                                <input type="number" placeholder="849" class="w-[290px] h-9 border border-gray-400 rounded-md text-[10px] text-gray-800 dark:text-gray-200 outline-none focus:border-gray-500 pl-4">
                            
                                
                            </div>
                            </div>

                            <!-- Parcelamento -->
                            <div class="mb-3">
                                <label class="block text-[12px] text-gray-600 dark:text-gray-400 mb-1 font-medium">
                                    Parcelamento
                                </label>

                                <input type="select" placeholder="3x de R$ 96,33 sem juros" class="w-full h-9 border border-gray-400 rounded-md text-[10px] text-gray-800 dark:text-gray-200 outline-none focus:border-gray-500 pl-4">
                            
                            </div>
                            
                            </div>
                        
                            
                            
                        </section>
                     </div>
                </div>

            </div>
        </div>

    </main>

</body>
</html>
